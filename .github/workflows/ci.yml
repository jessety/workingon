name: ci

on:
  push:
    branches:
      - main
    tags:
      - 'v*' # Tags matching v*, e.g. v1.0, v0.3.1
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  test:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # Windows temporarily disabled — restore with: os: [ubuntu-latest, windows-latest]
        # macos-latest is prohibitively expensive, use sparingly
        node: [26.x, 24.x, 22.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Tests
        run: npm run test

  lint:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint

  release:
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: ['build', 'test', 'lint']
    permissions:
      contents: write # required to create a release
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Release notes are generated by GitHub from merged PRs since the last release.
        # Categories/exclusions are configurable via .github/release.yml if wanted.
        run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --verify-tag --generate-notes
